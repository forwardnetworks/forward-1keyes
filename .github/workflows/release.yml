name: release

# A pushed tag v<version> builds, checks and publishes a release.
# A manual run does everything except publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: build and package every target
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^const ToolVersion = "\([^"]*\)"$/\1/p' src/compositionroot/run.go)
          test -n "$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match the program's version $version" >&2
            exit 1
          fi
          mkdir dist
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              name="forward-1keyes_${version}_${os}_${arch}"
              exe=forward-1keyes
              if [ "$os" = windows ]; then exe=forward-1keyes.exe; fi
              mkdir "$name"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "$name/$exe" ./src/cmd/forward-1keyes
              cp LICENSE README.md "$name/"
              if [ "$os" = windows ]; then
                zip -q -r "dist/$name.zip" "$name"
              else
                tar -czf "dist/$name.tar.gz" "$name"
              fi
            done
          done
          (cd dist && sha256sum forward-1keyes_* > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: run (${{ matrix.target }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux_amd64, os: ubuntu-latest }
          - { target: linux_arm64, os: ubuntu-24.04-arm }
          - { target: darwin_arm64, os: macos-latest }
          - { target: darwin_amd64, os: macos-15-intel }
          - { target: windows_amd64, os: windows-latest }
          - { target: windows_arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: unpack the archive and run the program
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z x -y forward-1keyes_*_${{ matrix.target }}.zip > /dev/null
            exe=forward-1keyes.exe
          else
            tar -xzf forward-1keyes_*_${{ matrix.target }}.tar.gz
            exe=forward-1keyes
          fi
          dirs=(forward-1keyes_*_${{ matrix.target }}/)
          "./${dirs[0]}$exe" --help

  publish:
    needs: smoke
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
